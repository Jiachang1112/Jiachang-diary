<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="t d">
  <title id="t">專屬時光日記 Jiachang-diary</title>
  <desc id="d">雲端日記：心情、標籤、搜尋、自訂背景、深淺色與匯出</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b4d"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050a1f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="450" fill="url(#bg)"/>
  <rect width="1280" height="450" fill="url(#dots)"/>
  <circle cx="1170" cy="40" r="190" fill="#facc15" opacity="0.35"/>
  <circle cx="90" cy="430" r="150" fill="#a78bfa" opacity="0.25"/>
  <circle cx="1230" cy="420" r="120" fill="#38bdf8" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="70" y="56" width="1140" height="338" rx="22" fill="#fdfdfb"/>
  </g>
  <rect x="70" y="56" width="1140" height="8" rx="4" fill="url(#bar)"/>
  <circle cx="106" cy="130" r="7" fill="#e2e5ee"/>
  <circle cx="106" cy="196" r="7" fill="#e2e5ee"/>
  <circle cx="106" cy="262" r="7" fill="#e2e5ee"/>

  <rect x="150" y="104" width="292" height="84" rx="6" fill="#ffe56a"/>
  <text x="162" y="168" font-family="'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif" font-size="66" font-weight="900" fill="#101a3d">時光日記</text>

  <text x="152" y="228" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#4a5163">雲端日記  ・  心情標籤  ・  自訂背景  ・  深淺色  ・  匯出</text>

  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="600">
    <rect x="152" y="258" width="117" height="40" rx="20" fill="#1d4ed8"/>
    <text x="210.5" y="284" text-anchor="middle" fill="#ffffff">📖 寫日記</text>
    <rect x="283" y="258" width="100" height="40" rx="20" fill="#f59e0b"/>
    <text x="333.0" y="284" text-anchor="middle" fill="#101a3d">🙂 心情</text>
    <rect x="397" y="258" width="103" height="40" rx="20" fill="#0b7a5c"/>
    <text x="448.5" y="284" text-anchor="middle" fill="#ffffff">🏷️ 標籤</text>
    <rect x="514" y="258" width="134" height="40" rx="20" fill="#1e293b"/>
    <text x="581.0" y="284" text-anchor="middle" fill="#ffffff">🌙 深色模式</text>
  </g>
  <text x="152" y="350" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#7a8194">HTML ‧ JavaScript ‧ Firebase　GitHub Pages 靜態網站</text>

  <g transform="translate(878 112)">
    <rect x="40" y="10" width="180" height="224" rx="18" fill="#1e3a8a" stroke="#0b1b4d" stroke-width="6"/>
    <rect x="56" y="10" width="12" height="224" fill="#172554"/>
    <rect x="84" y="40" width="112" height="138" rx="10" fill="#eff6ff"/>
    <g stroke="#93c5fd" stroke-width="5" stroke-linecap="round"><path d="M98 118 h84 M98 138 h84 M98 158 h56"/></g>
    <path d="M168 54 a26 26 0 1 0 14 46 a20 20 0 0 1 -14 -46 z" fill="#facc15" stroke="#854d0e" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#facc15"><circle cx="112" cy="62" r="4"/><circle cx="130" cy="84" r="3"/><circle cx="104" cy="92" r="3"/></g>
    <path d="M214 196 L252 100 l18 8 -38 96 -22 8 z" fill="#f59e0b" stroke="#7c2d12" stroke-width="5" stroke-linejoin="round"/>
